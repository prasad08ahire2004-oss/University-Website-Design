<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Website Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="header">

        <nav>
            <a href="index.html">
                <img src="images/logo.png" alt="University Logo">
            </a>

            <div class="nav-links" id="navLinks">

                <!-- Back / Close Button -->
                <button class="back-btn" onclick="hideMenu()" aria-label="Close menu">
                    &times;
                </button>

                <ul>
                    <li><a href="#">HOME</a></li>
                    <li><a href="#">ABOUT</a></li>
                    <li><a href="#">COURSE</a></li>
                    <li><a href="#">BLOG</a></li>
                    <li><a href="#">CONTACT</a></li>
                </ul>

            </div>

            <!-- Hamburger Button -->
            <button class="menu-btn" onclick="showMenu()" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>

        <div class="text-box">

            <h1>World's Biggest University</h1>

            <p>Making website is one of the easiest thing in the world. You just need to learn HTML, CSS, <br> Javascript and you are good to go.</p>

            <a href="" class="hero-btn">Visit Us To Know More</a>

        </div>
        
    </section>



    <script>
        const navLinks = document.getElementById("navLinks");

        function showMenu() {
            navLinks.style.right = "0";
        }

        function hideMenu() {
            navLinks.style.right = "-250px";
        }
    </script>
    
</body>
</html>
    
</body>
</html>
